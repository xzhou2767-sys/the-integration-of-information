ktor {
    deployment {
        host = "0.0.0.0"
        host = ${?HOST}
        port = 8765
        port = ${?PORT}
    }
    application {
        # 模块在 ApplicationKt.main 的 embeddedServer 中显式装配
    }
}

trae {
    proxy {
        # 3xui 订阅 URL（云端自动拉取、解析、测速、选优，客户端不感知）
        subscription-url = "https://3x.955273.xyz:2096/sub/e8hac5ygz4p6rbza"
        subscription-url = ${?TRAE_PROXY_SUB_URL}
        # Xray-core 可执行文件；请在服务器安装 xray 后将其放入 PATH 或填写绝对路径
        xray-path = "xray"
        xray-path = ${?XRAY_PATH}
        socks-base-port = 10810
        refresh-interval-min = 30
        probe-url = "https://www.gstatic.com/generate_204"
        probe-url = ${?PROBE_URL}
    }
    ai {
        # 豆包 = 火山引擎方舟（Ark）官方 OpenAI 兼容接口；model 可填模型 ID 或推理接入点 ep-xxxx
        doubao {
            api-key = ""
            api-key = ${?DOUBAO_API_KEY}
            model = "doubao-pro-32k"
            model = ${?DOUBAO_MODEL}
            base-url = "https://ark.cn-beijing.volces.com/api/v3"
            base-url = ${?DOUBAO_BASE_URL}
        }
        openai {
            api-key = ""
            api-key = ${?OPENAI_API_KEY}
            model = "gpt-4o-mini"
            model = ${?OPENAI_MODEL}
            base-url = "https://api.openai.com/v1"
            base-url = ${?OPENAI_BASE_URL}
        }
        gemini {
            api-key = ""
            api-key = ${?GEMINI_API_KEY}
            model = "gemini-2.5-flash"
            model = ${?GEMINI_MODEL}
        }
    }
    crawler {
        # YouTube Data API v3 Key（走云端代理）
        youtube.api-key = ""
        youtube.api-key = ${?YOUTUBE_API_KEY}
        # X/Twitter API v2 Bearer Token（走云端代理）
        x.bearer-token = ""
        x.bearer-token = ${?X_BEARER_TOKEN}
        # SerpAPI Key：抖音/小红书/Quora 无公开 API，通过 Google 站内检索间接获取
        serpapi.api-key = ""
        serpapi.api-key = ${?SERPAPI_KEY}
        # 浏览器伴侣脚本（Tampermonkey）上报令牌，需与脚本中 TOKEN 一致
        companion.token = "trae-companion"
        companion.token = ${?COMPANION_TOKEN}
    }
}
